
apiVersion: apps/v1
kind: Deployment
metadata:
  name: online-book-store
spec:
  replicas: 2
  selector:
    matchLabels:
      app: online-book-store
  template:
    metadata:
      labels:
        app: online-book-store
    spec:
      containers:
        - name: online-book-store
          image: naresh252006/online-book-store:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: online-book-store-service
spec:
  type: NodePort
  selector:
    app: online-book-store
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30007
